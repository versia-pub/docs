name: Lint & Format

on:
    push:
        branches: ["*"]
    pull_request:
        # The branches below must be a subset of the branches above
        branches: ["main"]

jobs:
    tests:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Deno
              uses: denoland/setup-deno@v2

            - name: Install dependencies
              run: |
                  deno install

            - name: Run linting
              run: |
                  deno run -A npm:@biomejs/biome ci .
