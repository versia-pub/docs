name: Build

on:
    push:
        branches: ["*"]
    pull_request:
        # The branches below must be a subset of the branches above
        branches: ["main"]

jobs:
    tests:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Deno
              uses: denoland/setup-deno@v2

            - name: Install dependencies
              run: |
                  deno install

            - name: Find unused files and dependencies
              run: |
                  deno task knip

            - name: Build
              run: |
                  deno task build

            - name: Check links
              run: |
                  deno task check-links
